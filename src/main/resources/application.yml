server:
  port: 8080

spring:
  application:
    name: pathprep
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/pathprep?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:1315}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
  level:
    com.swayam.pathprep: DEBUG
    org.springframework.web: INFO

app:
  sessions:
    max-questions: 20
    default-question-count: 8
  cors:
    allowed-origins:
      - "http://localhost:3000"
