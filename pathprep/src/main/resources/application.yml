server:
  port: 8080
  # Configure forward headers strategy so client IP resolution behind reverse proxy uses X-Forwarded-For.
  # Proxy-trust assumption: The application runs behind a trusted reverse proxy (e.g. Nginx, Cloudflare, AWS ALB)
  # that strips or normalizes incoming X-Forwarded-For headers from untrusted clients before setting the real client IP.
  forward-headers-strategy: framework

spring:
  profiles:
    active: dev
  application:
    name: pathprep
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/pathprep?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:1315}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
  level:
    com.swayam.pathprep: DEBUG
    org.springframework.web: INFO

app:
  time-zone: Asia/Kolkata
  learning:
    daily-goal: 10
    mastery-window: 20
    mastery-prior-correct: 1
    mastery-prior-attempts: 2
    mastered-threshold: 80
    prerequisite-threshold: 60
    review-intervals-days:
      - 1
      - 3
      - 7
      - 14
    max-seconds-per-answer: 300
    min-answers-for-readiness: 10
    min-mistakes-for-clearance: 5
  sessions:
    max-questions: 20
    default-question-count: 8
  cors:
    allowed-origins:
      - "http://localhost:3000"
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:1012901304842-qi5cgegchnle6uif6r1fvj6cflqpr7gc.apps.googleusercontent.com}
    jwt:
      secret: ${JWT_SECRET:super-secret-dev-jwt-key-minimum-32-bytes-long!}
      issuer: pathprep
      access-ttl: 15m
      refresh-ttl: 30d
    refresh-cookie:
      name: pp_refresh
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: Lax
      path: /api/v1/auth
    admin-emails: ${ADMIN_EMAILS:admin@nie.edu.in ,swayamgarg117@gmail.com}
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:nie.edu.in}
    allow-any-google-account: ${ALLOW_ANY_GOOGLE_ACCOUNT:true}
    dev-login-enabled: ${DEV_LOGIN_ENABLED:true}
  admin:
    # Set ADMIN_API_KEY env var in production. Defaults to dev-admin-secret for local development.
    api-key: ${ADMIN_API_KEY:dev-admin-secret}
