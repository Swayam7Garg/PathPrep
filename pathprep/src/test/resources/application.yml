spring:
  profiles:
    active: test
  datasource:
    url: jdbc:mysql://localhost:3306/pathprep_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:1315}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false
    validate-on-migrate: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
  level:
    com.swayam.pathprep: DEBUG

app:
  time-zone: Asia/Kolkata
  ai:
    provider: MOCK
    daily-free-call-limit: 15
    daily-free-token-limit: 25000
    shared-pool-daily-token-budget: 250000
  learning:
    daily-goal: 10
    mastery-window: 20
    mastery-prior-correct: 1
    mastery-prior-attempts: 2
    mastered-threshold: 80
    prerequisite-threshold: 60
    review-intervals-days:
      - 1
      - 3
      - 7
      - 14
    max-seconds-per-answer: 300
    min-answers-for-readiness: 10
    min-mistakes-for-clearance: 5
  sessions:
    max-questions: 20
    default-question-count: 8
  cors:
    allowed-origins:
      - "http://localhost:3000"
  auth:
    google:
      client-id: test-google-client-id.apps.googleusercontent.com
    jwt:
      secret: test-jwt-secret-min-32-chars-for-testing-suite!!
      issuer: pathprep
      access-ttl: 15m
      refresh-ttl: 30d
    refresh-cookie:
      name: pp_refresh
      secure: false
      same-site: Lax
      path: /api/v1/auth
    admin-emails: admin@nie.edu.in
    allowed-email-domains: nie.edu.in
    allow-any-google-account: false
    dev-login-enabled: true
  admin:
    api-key: test-admin-key
